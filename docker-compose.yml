# docker-compose.yml
version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: kom-way-db-dev
    restart: always
    environment:
      POSTGRES_USER: kom_way_admin
      POSTGRES_PASSWORD: kjkj
      POSTGRES_DB: kom_way_db_dev
    ports:
      - "5433:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data

  web:
    build: .
    container_name: kom-way-app-dev
    restart: always
    ports:
      - "8001:8000"
    volumes:
      - ./app:/code/app
    environment:
      - DATABASE_URL=postgresql://kom_way_admin:kjkj@db:5432/kom_way_db_dev
    depends_on:
      - db

volumes:
  pgdata_dev:
