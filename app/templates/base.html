<!-- templates/base.html -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <title>{% block title %}{% endblock %} - Kom-Way</title>
</head>
<body>
    <main class="container">
        {% block content %}{% endblock %}
        <footer style="margin-top: 2rem; border-top: 1px solid var(--pico-muted-border-color); text-align: center; padding-top: 1rem;">
            <small>&copy; 2026</small>
        </footer>
    </main>
</body>
</html>
